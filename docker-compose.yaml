services:
  app:
    build:
      # workspace の依存を解決するため、build context は monorepo のルート
      context: .
      dockerfile: apps/chros/Dockerfile
    ports:
      - "3000:3000"
    environment:
      #NOTE: 本番環境の時は、以下の変数を変えること。
      - NODE_ENV=development
      - DATABASE_URL=postgresql://user:password@db:5432/database
      - NEXT_PUBLIC_APP_URL=http://localhost:3000
    depends_on:
      db:
        condition: service_healthy

  db:
    image: postgres:17
    environment:
      - POSTGRES_USER=user
      - POSTGRES_PASSWORD=password
      - POSTGRES_DB=database
    ports:
      - "5432:5432"
    volumes:
      - db-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U user -d database"]
      interval: 5s
      timeout: 5s
      retries: 10

volumes:
  db-data:
